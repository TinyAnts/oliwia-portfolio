<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Oliwia Konieczna</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:linear-gradient(180deg,#fff7f1 0%,#fff4ec 100%);color:#33211c;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{max-width:560px;background:#fff;border:1px solid #f4dccd;border-radius:28px;padding:64px 44px;box-shadow:0 30px 70px -45px rgba(232,93,69,.4);position:relative;overflow:hidden}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#e85d45,#f09e5e)}
.pill{display:inline-flex;background:#fdeae2;color:#b64a33;padding:8px 18px;border-radius:100px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;margin-bottom:22px}
.num{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(6rem,20vw,9rem);line-height:1;background:linear-gradient(120deg,#e85d45,#f09e5e);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(1.4rem,4vw,1.9rem);margin-bottom:12px}
p{color:#5f4a42;line-height:1.7;margin-bottom:32px}
a.btn{display:inline-block;text-decoration:none;color:#fff;font-weight:500;padding:14px 36px;background:#e85d45;border-radius:100px;transition:background .25s,transform .2s}
a.btn:hover{background:#c94a35;transform:translateY(-2px)}
.sig{color:#e85d45}
</style>
</head>
<body>
<div class="card">
<div class="pill"><span class="sig">✦</span>&nbsp; Error 404</div>
<div class="num">404</div>
<h1>This page went off the roadmap.</h1>
<p>The page you're looking for doesn't exist or has moved. Let's get you back to the work.</p>
<a class="btn" href="/">Back to the portfolio</a>
</div>
</body>
</html>
